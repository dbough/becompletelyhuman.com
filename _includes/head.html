{%- assign page_title = page.title | default: site.title -%}
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip }}">
{% if page.noindex %}<meta name="robots" content="noindex">
{% endif %}<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#121110">

<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% include theme-vars.html %}

{%- if site.theme_switcher %}
<script>
  /* Apply a saved accent before the page paints, so there's no flash. */
  (function () {
    var allowed = [{% for p in site.data.palettes %}"{{ p.id }}"{% unless forloop.last %},{% endunless %}{% endfor %}];
    try {
      var saved = localStorage.getItem("ch-accent");
      if (saved && allowed.indexOf(saved) !== -1) {
        document.documentElement.setAttribute("data-accent", saved);
      }
    } catch (e) { /* storage blocked: keep the default */ }
  })();
</script>
{%- endif %}

{% include analytics.html %}
