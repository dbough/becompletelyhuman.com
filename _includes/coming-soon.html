<section class="soon" aria-labelledby="soon-title">
  <div class="container soon__inner">
    <img class="soon__logo" src="{{ '/assets/img/logo.png' | relative_url }}" alt="Completely Human logo" width="144" height="144">
    {% include eyebrow-list.html text=site.coming_soon.eyebrow %}
    <h1 id="soon-title" class="soon__title">Completely <span>Human</span></h1>
    <p class="soon__message">{{ site.coming_soon.message }}</p>
    <a class="btn btn--primary btn--large" href="mailto:{{ site.email }}">{{ site.email }}</a>
  </div>
</section>
