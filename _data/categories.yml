# ---------------------------------------------------------------
# Category cards on the homepage, shown in this order.
#
# Fields:
#   name         Card title
#   icon         Name of a line icon in _includes/icon.html (heart-handshake,
#                laptop, compass, sprout, wrench, video, mail). Decorative, hidden from screen readers.
#   description  One to three short sentences
#   link         Optional. Full URL or a site path like /coaching/. Leave blank and the
#                card points to the contact section instead.
#   link_label   Optional. Button text when there's a link.
#
# To add a category, copy a block, paste it where you want it, edit.
# Keep stealth projects out of here. Describe the category, not the project.
# ---------------------------------------------------------------

- name: Coaching
  icon: heart-handshake
  description: >-
    Life coaching for anyone looking to grow. We'll partner with you, be your
    biggest supporter and fan, and help you get where you want to go.
  link: /coaching/
  link_label: Learn more

- name: Tech Consulting
  icon: laptop
  description: >-
    Twenty-plus years in tech, from support and networks to software and
    engineering leadership, put to work for you and your business. We help
    you save time and money with technology, including AI, and often with
    the tools you already use.
  link: /tech-consulting/
  link_label: Learn more

- name: Content Creation
  icon: video
  description: >-
    Reach more people. Videos and short-form content for brands that want
    to get in front of the audience we're building. Made by a real person,
    mistakes included.
  link: /content-creation/
  link_label: Learn more
