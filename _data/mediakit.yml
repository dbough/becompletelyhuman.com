# Add a name only after the partner says it's fine to list them.
# Leave empty ([]) and the section stays out of the page.
partners: []

fit_yes:
  - Products and services we'd actually use
  - Career, job search, and professional growth
  - Tech, AI, and productivity tools
  - Tools that help with focus, planning, and ADHD
  - Faith-friendly brands
  - Honest reviews, including what we didn't love
  - Brands happy to let a real person say it their own way
fit_no:
  - Anything we haven't tried or wouldn't recommend
  - Scripts to read word for word
  - Hidden sponsorships. Paid content is always labeled
  - Gambling, get-rich-quick offers and similar

process:
  - title: Say hello
    text: Email a short brief or just the idea. No formal pitch needed.
  - title: Fit check
    text: We try the product and tell you honestly whether it's a fit.
  - title: Agree on the details
    text: Format, usage rights, price and timing, in writing before any work starts.
  - title: Outline and review
    text: We share the key points for your approval. They're talking points, not a script.
  - title: Make it, post it, report back
    text: You see a draft first. After it goes live, we send the results.

contact_subject: Partnership inquiry
