# Formats and rates. Price is text so "$1,000" and "Quoted per project" both
# work. Titles stay short: they also show as tags on /content-creation/.
offers:
  - title: Mid-roll sponsor spot
    icon: video
    price: $500
    text: A 60 to 90 second spot in the middle of a Dan Unfinished video, in Dan's own words and clearly labeled as sponsored.
  - title: Dedicated video
    icon: camera
    price: $1,000
    text: A full YouTube video, up to 10 minutes, built around your product or service. Honest first impressions and a real walkthrough.
  - title: Instagram Reel
    icon: smartphone
    price: Quoted per project
    text: A Reel made to fit the platform instead of copied from an ad.
  - title: UGC for your channels
    icon: megaphone
    price: Quoted per project
    text: Videos made for you to post yourself, with usage rights agreed up front.

rates_note: >-
  YouTube rates are current as of this update and may go up as the channel
  grows. Instagram and UGC are quoted per project. Extended usage rights,
  exclusivity, or a rush timeline are quoted separately.

