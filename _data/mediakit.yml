    icon: youtube
    url: "https://www.youtube.com/@danunfinished"
    period: Last 28 days
    stats:
      - label: Subscribers
        value: 3.5K
      - label: Views
        value: 708K
      - label: Watch hours
        value: 20.6K
    note: >-
      Honest, long-form videos about career setbacks, the tech industry, and
