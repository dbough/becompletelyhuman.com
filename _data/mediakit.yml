# ---------------------------------------------------------------
# Media kit data. This is the ONLY file you edit to keep /media-kit/ current.
# The page fills itself in from here.
#
# Monthly update (about 10 minutes):
#   1. Open YouTube Studio (Media Kit tab, last 28 days) and Instagram
#      Insights (Professional dashboard, last 30 days).
#   2. Update the numbers below. Round them: 4.2K, not 4,187.
#   3. Change `updated` to today's date.
#   4. Commit and push. The "Updated" stamp on the page follows.
#
# Numbers last taken from YouTube Studio (28 days) and Instagram (30 days)
# on 2026-11-25. Never put a made-up number here. If a number isn't
# available, leave the line out instead of writing TBD.
#
# While `draft: true` is set, the page shows a banner. It's off now that the
# real numbers are in. Add `draft: true` back if you start a big rewrite.
#
# Quote anything with a colon in it, like "3:56". Without quotes, YAML
# reads it as a number.
#
# The "Download the one-page PDF" link on /media-kit/ points at a PDF the
# deploy builds from this file (page: media-kit/one-sheet/). Nothing to
# maintain: update the numbers and push. The full page also prints with
# Save as PDF if someone wants the long version.
# ---------------------------------------------------------------

updated: 2026-11-25

# Third person, a few short sentences. This is the first thing a brand reads.
name: Dan Bough
tagline: A guy redesigning the next chapter of his life, out loud.
bio: >-
  Dan Bough spent more than twenty years in tech, from support and networks
  to software and engineering leadership. After losing his engineering
  manager job at 48, he started making videos about what comes next. On
  YouTube, that's career setbacks, the tech industry, and rebuilding. On
  Instagram, it's short, funny takes on middle age, ADHD, and faith.
  Honest, a little messy, and funny when it fits.

# Three big numbers at the top of the page and on /content-creation/.
highlights:
  - value: 708K
    label: YouTube views, last 28 days
  - value: 279K
    label: Instagram views, last 30 days
  - value: 35 to 54
    label: About 70% of YouTube viewers and 75% of Instagram followers

