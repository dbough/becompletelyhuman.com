# ---------------------------------------------------------------
# Media kit data. This is the ONLY file you edit to keep /media-kit/ current.
# The page fills itself in from here.
#
# Monthly update (about 10 minutes):
#   1. Open each platform's analytics (last 28 days).
#   2. Update the numbers below. Round them: 4.2K, not 4,187.
#   3. Change `updated` to today's date.
#   4. Commit and push. The "Updated" stamp on the page follows.
#
# While `draft: true`, the page shows a banner and every TBD is a
# placeholder. Delete the `draft` line when the real numbers are in.
# Never put a made-up number here.
#
# To save a PDF: open /media-kit/, print, choose "Save as PDF".
# ---------------------------------------------------------------

