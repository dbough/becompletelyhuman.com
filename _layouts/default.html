<!doctype html>
<html lang="en"{% if site.theme_switcher %} data-accent="{{ site.accent }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% if page.show_header or site.coming_soon.enabled == false %}{% include header.html %}{% endif %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  {% if site.theme_switcher %}{% include theme-switcher.html %}{% endif %}
</body>
</html>
